# 生产部署 —— 适配 1Panel 服务器
# 80/443 由 1Panel openresty 管理（conf.d/chenxu233.conf 反代）
# 容器只暴露内部端口，避开服务器上其他服务
services:
  frontend:
    image: ghcr.io/${GITHUB_REPO_OWNER:-chenxu233}/chenxu-blog-frontend:latest
    container_name: blog-frontend
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - NUXT_API_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - blog-network

  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER:-chenxu233}/chenxu-blog-backend:latest
    container_name: blog-backend
    ports:
      - "127.0.0.1:8100:8000"
    env_file:
      - ./backend/.env
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_URL=http://chenxu233.cn/images
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - blog-network

  minio:
    image: minio/minio:latest
    container_name: blog-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - blog-network

volumes:
  minio_data:

networks:
  blog-network:
    driver: bridge
