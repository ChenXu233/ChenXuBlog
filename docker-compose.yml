# 生产部署 —— 适配 1Panel 服务器
# 80/443 由 1Panel openresty 管理（conf.d/chenxu233.conf 反代）
# 容器只暴露内部端口，避开服务器上其他服务
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - NUXT_API_INTERNAL_URL=http://backend:8000
      - NUXT_APP_BUILD_ASSETS_DIR=/_nuxt/
      - NUXT_PUBLIC_SITE_URL=https://chenxu233.cn
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - blog-network

  # 网关：宿主机 openresty(80/443+TLS) → 这里(:80) → 各容器
  # 仅绑定 127.0.0.1，外部流量一律经 openresty 进来
  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    ports:
      - "127.0.0.1:3200:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - blog-network

  backend:
    image: ghcr.io/chenxu233/chenxu-blog-backend:latest
    container_name: blog-backend
    ports:
      - "127.0.0.1:8100:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_URL=http://chenxu233.cn/images
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blog-network

  minio:
    image: minio/minio:latest
    container_name: blog-minio
    ports:
      - "127.0.0.1:9200:9000"
      - "127.0.0.1:9201:9001"
    env_file:
      - ./backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in backend/.env}"
        : "$${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in backend/.env}"
        export MINIO_ROOT_USER="$$MINIO_ACCESS_KEY"
        export MINIO_ROOT_PASSWORD="$$MINIO_SECRET_KEY"
        exec minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - blog-network

volumes:
  minio_data:

networks:
  blog-network:
    driver: bridge
