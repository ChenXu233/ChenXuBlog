server {
    listen 80;
    listen 443 ssl http2;
    server_name chenxu233.cn;

    # ----- 强制 HTTPS（必须放在最前面）-----
    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }

    # ----- 日志 -----
    access_log /www/sites/chenxu233/log/access.log main;
    error_log  /www/sites/chenxu233/log/error.log;

    # ----- SSL 证书配置（保持你原来的）-----
    ssl_certificate     /www/sites/chenxu233/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/chenxu233/ssl/privkey.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- 安全头 -----
    add_header Strict-Transport-Security "max-age=31536000";
    proxy_set_header X-Forwarded-Proto https;

    # ----- 隐藏敏感文件 -----
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # ----- 防止访问 .well-known 下的可执行文件 -----
    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # ----- Let's Encrypt 验证目录（保持不变）-----
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # ========== 反代改造 ==========
    # 通用反代头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API → FastAPI (8100)
    location /apis/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 图片 → MinIO (9100)
    location /images/ {
        proxy_pass http://127.0.0.1:9100/chenxu-blog-images/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 其余 → Nuxt SSR (3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
