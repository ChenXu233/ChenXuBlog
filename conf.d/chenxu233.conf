# chenxu233.cn 反代配置（1Panel openresty）
#
# 链路：openresty(80/443) → 容器（见根目录 docker-compose.yml，仅绑定 127.0.0.1）
#   /apis/   → FastAPI      127.0.0.1:8100
#   /images/ → MinIO        127.0.0.1:9200 (bucket: chenxu-blog-images)
#   其余     → Nuxt SSR     127.0.0.1:3100

server {
    listen 80;
    listen 443 ssl http2;
    server_name chenxu233.cn;

    # HTTP → HTTPS
    if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }

    # ----- 日志 -----
    access_log /www/sites/chenxu233/log/access.log main;
    error_log  /www/sites/chenxu233/log/error.log;

    # ----- SSL -----
    ssl_certificate     /www/sites/chenxu233/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/chenxu233/ssl/privkey.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000";

    # Let's Encrypt 验证
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # ----- 通用反代头 -----
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # API → FastAPI
    location /apis/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 图片 → MinIO
    location /images/ {
        proxy_pass http://127.0.0.1:9200/chenxu-blog-images/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 其余 → Nuxt SSR（WebSocket 升级头供 HMR/长连接用）
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
