name: Server health check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check containers and storage
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -e
            cd /opt/chenxu233.cn
            docker compose ps
            echo "--- latest backend storage status ---"
            status="$(docker compose logs --no-color --tail=300 backend 2>&1 | grep -E 'MinIO (connected|init failed)' | tail -n 1 || true)"
            echo "$status"
            case "$status" in
              *"MinIO connected"*) ;;
              *) echo "WARNING: Backend is not using MinIO" ;;
            esac
            curl -fsS http://127.0.0.1:9200/minio/health/live > /dev/null
            curl -fsS http://127.0.0.1:3200/home > /dev/null
            curl -fsS http://127.0.0.1:3200/apis/v1/blog/ > /dev/null
            echo "--- buildAssetsDir by hop ---"
            docker compose exec -T frontend sh -c 'find /app/output/server -maxdepth 3 -type f | head -n 30'
            docker compose exec -T frontend sh -c 'grep -R -n buildAssetsDir /app/output/server 2>/dev/null | head -n 5 || true'
            docker compose exec -T frontend printenv | grep -E '^(NUXT|NODE_ENV|HOST|PORT)' || true
            echo "--- direct frontend HTML ---"
            curl -s http://127.0.0.1:3100/home | grep -o 'buildAssetsDir.\{0,50\}' | head -n 1
            echo "--- caddy HTML ---"
            curl -s http://127.0.0.1:3200/home | grep -o 'buildAssetsDir.\{0,50\}' | head -n 1
            echo "--- openresty rewrite rules ---"
            grep -R -n -E 'sub_filter|/_nuxt/v2|proxy_pass|chenxu233' /opt/1panel/apps/openresty/openresty/conf/conf.d 2>/dev/null | head -n 100 || true
            echo "--- local public HTML ---"
            curl -ks --resolve chenxu233.cn:443:127.0.0.1 https://chenxu233.cn/home | grep -o 'buildAssetsDir.\{0,50\}' | head -n 1
            echo "--- frontend asset files ---"
            docker compose exec -T frontend sh -c 'find /app/output/public/_nuxt -maxdepth 2 -type f | head -n 20'
            docker compose exec -T frontend sh -c 'ls -l /app/output/public/_nuxt/v2/CsZdZF-f.js || true'
            echo "--- asset responses ---"
            curl -s -o /dev/null -w 'frontend direct: %{http_code}' http://127.0.0.1:3100/_nuxt/v2/CsZdZF-f.js
            echo
            curl -s -o /dev/null -w 'caddy: %{http_code}' http://127.0.0.1:3200/_nuxt/v2/CsZdZF-f.js
            echo
            echo "Production health check passed"
