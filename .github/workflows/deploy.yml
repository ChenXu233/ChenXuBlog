name: Build & Deploy

on:
  # 只有打 tag（如 v1.0.0）才部署；master push 只跑 CI（见 ci.yml）
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build + Deploy (password auth)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt (frontend .output)
        working-directory: frontend
        run: pnpm build

      # backend 镜像在 CI 构建（服务器 build 太慢会超时）
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/chenxu233/chenxu-blog-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 前端产物 .output → 服务器（服务器只 COPY，零编译）
      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "frontend/.output"
          target: "/opt/chenxu233.cn/frontend/"
          strip_components: 1

      # 后端源码（服务器不再 build，但保留 Dockerfile 备用）
      # Caddyfile：caddy 容器挂载的路由配置，必须同步到服务器
      - name: Upload config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "frontend/Dockerfile,frontend/.dockerignore,docker-compose.yml,Caddyfile"
          target: "/opt/chenxu233.cn/"

      - name: Pull backend + build frontend + start
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /opt/chenxu233.cn
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose build frontend
            docker compose pull backend
            docker compose up -d
            docker image prune -f
            # 注：openresty 站点配置由服务器上的 1Panel 面板管理，
            # 只需保证反代目标为 http://127.0.0.1:3200（Caddy 网关）

      - name: Verify deployment
        run: |
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null https://chenxu233.cn/home && curl -sf -o /dev/null https://chenxu233.cn/apis/v1/blog/; then
              echo "Deployment verified"
              exit 0
            fi
            echo "waiting... ($i/20)"
            sleep 15
          done
          echo "Deployment verification FAILED"
          exit 1
