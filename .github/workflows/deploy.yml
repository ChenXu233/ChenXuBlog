name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/chenxu-blog-frontend
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/chenxu-blog-backend

jobs:
  build-and-push:
    name: Build images in CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 前端镜像：CI 编译 Nuxt → .output 进镜像。服务器零编译。
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 后端镜像：CI 安装依赖。
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & restart on server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只同步部署配置（compose + Caddyfile + .env 由服务器维护）
      - name: Upload deploy files
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-avz --delete --exclude=backend --exclude=frontend --exclude=e2e --exclude=docs --exclude=.github --exclude=.git"
          SOURCE: "./"
          TARGET: "/opt/chenxu233.cn/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/chenxu233.cn
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Verify deployment
        run: |
          sleep 45
          curl -f -o /dev/null -s https://chenxu233.cn/ || exit 1
          curl -f -o /dev/null -s https://chenxu233.cn/apis/v1/blog/ || exit 1
