name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Nuxt in CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt
        working-directory: frontend
        run: pnpm build

      - name: Upload .output artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output
          path: frontend/.output
          retention-days: 1

  deploy:
    name: Deploy to 1Panel server (password auth)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download .output
        uses: actions/download-artifact@v4
        with:
          name: nuxt-output
          path: frontend/.output

      # 传前端构建产物（.output）—— 服务器零编译
      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "frontend/.output/*"
          target: "/opt/chenxu233.cn/frontend/.output/"

      # 传后端源码（服务器上 build 装依赖，非编译）
      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "backend/Dockerfile,backend/pyproject.toml,backend/uv.lock,backend/main.py,backend/src,docker-compose.yml,conf.d/*"
          target: "/opt/chenxu233.cn/"

      - name: Build and start containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /opt/chenxu233.cn
            # 前端镜像：只 COPY .output，无编译
            docker compose build frontend backend
            docker compose up -d
            docker image prune -f
            # 更新 1Panel openresty 反代配置并 reload
            cp conf.d/chenxu233.conf /opt/1panel/www/conf.d/chenxu233.conf
            docker exec 1Panel-openresty-W7py nginx -t && docker exec 1Panel-openresty-W7py nginx -s reload

      - name: Verify deployment
        run: |
          sleep 45
          curl -f -o /dev/null -s https://chenxu233.cn/ || exit 1
          curl -f -o /dev/null -s https://chenxu233.cn/apis/v1/blog/ || exit 1
