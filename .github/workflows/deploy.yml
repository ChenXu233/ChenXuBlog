name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Nuxt + Deploy (password auth)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt
        working-directory: frontend
        run: pnpm build

      # 前端产物 .output → 服务器（零编译）
      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "frontend/.output"
          target: "/opt/chenxu233.cn/frontend/"
          strip_components: 1

      # 后端源码 + 部署配置 → 服务器
      - name: Upload backend + config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "backend/Dockerfile,backend/pyproject.toml,backend/uv.lock,backend/main.py,backend/src,docker-compose.yml,conf.d/*"
          target: "/opt/chenxu233.cn/"

      - name: Build and start containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /opt/chenxu233.cn
            docker compose build frontend backend
            docker compose up -d
            docker image prune -f
            cp conf.d/chenxu233.conf /opt/1panel/www/conf.d/chenxu233.conf
            docker exec 1Panel-openresty-W7py nginx -t && docker exec 1Panel-openresty-W7py nginx -s reload

      - name: Verify deployment
        run: |
          sleep 45
          curl -f -o /dev/null -s https://chenxu233.cn/ || exit 1
          curl -f -o /dev/null -s https://chenxu233.cn/apis/v1/blog/ || exit 1
