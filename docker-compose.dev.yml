# 本地开发环境 —— 全栈 docker（backend + frontend 热重载）
# 用法: docker compose -f docker-compose.dev.yml up -d --build
# 前端: http://localhost:3000（Vite HMR；/apis 代理到 backend 容器）
# 后端: http://127.0.0.1:8001（uvicorn --reload）
services:
  backend:
    image: python:3.13-slim
    container_name: blog-backend-dev
    working_dir: /app
    command: >
      sh -c "pip install -q uv &&
      uv sync --frozen &&
      uv run uvicorn main:APP --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      # Windows 本地 .venv 是 Windows 二进制，用命名卷隔离容器内 .venv
      - backend_venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    image: node:22
    container_name: blog-frontend-dev
    working_dir: /app
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm dev --host 0.0.0.0 --port 3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules/.nuxt/.output 用命名卷隔离（Windows 与 Linux 二进制不互通）
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
      - frontend_output:/app/.output
      - pnpm_store:/root/.local/share/pnpm/store
    environment:
      - NUXT_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_nuxt:
  frontend_output:
  pnpm_store:
